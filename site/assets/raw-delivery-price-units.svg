<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 660" width="960" height="660" role="img" aria-label="Infographic of the price each of the three raw dog food delivery services publishes on 2026-09-27: We Feed Raw plans from 9.66 dollars a week against a 16.10 dollar list price, Darwin's packs from 15.00 to 26.00 dollars per 2.0-lb pack with a 10-lb minimum order, and Maev at 179 dollars for 20 pounds on subscription (6.39 dollars a day) against 206 dollars one-time - three different units that cannot be compared directly">
  <g font-family="Segoe UI, Arial, sans-serif">

    <text x="8" y="26" font-size="19" font-weight="700" fill="#0f172a">Best raw dog food delivery 2026: three services, three different rulers</text>
    <text x="8" y="50" font-size="13.5" fill="#475569">Every figure is printed on the brand's own site and was read on 2026-09-27 (UTC+8). Bars scale only inside their own panel - the units differ, so the panels do not line up.</text>

    <!-- ============ Panel 1: We Feed Raw ============ -->
    <rect x="8" y="70" width="304" height="376" rx="16" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
    <text x="26" y="100" font-size="15" font-weight="700" fill="#0f172a">We Feed Raw</text>
    <text x="26" y="120" font-size="12.5" font-weight="700" fill="#1d4ed8">PRICE UNIT: PER WEEK (plan start)</text>

    <text x="26" y="152" font-size="13" fill="#334155">Beef, chicken and turkey plans</text>
    <rect x="26" y="160" width="142" height="26" rx="7" fill="#60a5fa"/>
    <text x="176" y="179" font-size="14" font-weight="700" fill="#0f172a">$9.66 / week</text>

    <text x="26" y="216" font-size="13" fill="#334155">Lamb and duck plans</text>
    <rect x="26" y="224" width="158" height="26" rx="7" fill="#93c5fd"/>
    <text x="192" y="243" font-size="14" font-weight="700" fill="#0f172a">$10.71 / week</text>

    <text x="26" y="280" font-size="13" fill="#334155">Freeze-dried beef and chicken</text>
    <rect x="26" y="288" width="196" height="26" rx="7" fill="#bfdbfe"/>
    <text x="230" y="307" font-size="14" font-weight="700" fill="#0f172a">$13.21 / week</text>

    <line x1="26" y1="332" x2="294" y2="332" stroke="#cbd5e1" stroke-width="1"/>
    <text x="26" y="356" font-size="12.5" fill="#475569">List prices shown beside them: $16.10,</text>
    <text x="26" y="374" font-size="12.5" fill="#475569">$17.85 and $22.02. Frozen plans start at</text>
    <text x="26" y="392" font-size="12.5" fill="#475569">$8.89/lb ($9.89/lb lamb and duck).</text>

    <rect x="26" y="404" width="268" height="34" rx="8" fill="#fef3c7" stroke="#f59e0b"/>
    <text x="36" y="426" font-size="12" fill="#92400e">Free cold shipping, contiguous U.S., always.</text>

    <!-- ============ Panel 2: Darwin's ============ -->
    <rect x="328" y="70" width="304" height="376" rx="16" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
    <text x="346" y="100" font-size="15" font-weight="700" fill="#0f172a">Darwin's</text>
    <text x="346" y="120" font-size="12.5" font-weight="700" fill="#1d4ed8">PRICE UNIT: PER 2.0-LB PACKAGE</text>

    <text x="346" y="152" font-size="13" fill="#334155">BioLogics Raw Chicken</text>
    <rect x="346" y="160" width="124" height="26" rx="7" fill="#34d399"/>
    <text x="478" y="179" font-size="14" font-weight="700" fill="#0f172a">$15.00</text>

    <text x="346" y="216" font-size="13" fill="#334155">Natural Selections Premium Chicken</text>
    <rect x="346" y="224" width="155" height="26" rx="7" fill="#6ee7b7"/>
    <text x="509" y="243" font-size="14" font-weight="700" fill="#0f172a">$18.75</text>

    <text x="346" y="280" font-size="13" fill="#334155">Natural Selections Premium Duck</text>
    <rect x="346" y="288" width="216" height="26" rx="7" fill="#a7f3d0"/>
    <text x="570" y="307" font-size="14" font-weight="700" fill="#0f172a">$26.00</text>

    <line x1="346" y1="332" x2="614" y2="332" stroke="#cbd5e1" stroke-width="1"/>
    <text x="346" y="356" font-size="12.5" fill="#475569">Every pack is 2.0 lb, minimum order 10 lbs.</text>
    <text x="346" y="374" font-size="12.5" fill="#475569">Free shipping from 20 lbs, otherwise a fee;</text>
    <text x="346" y="392" font-size="12.5" fill="#475569">Alaska and Hawaii flat $150.</text>

    <rect x="346" y="404" width="268" height="34" rx="8" fill="#fef3c7" stroke="#f59e0b"/>
    <text x="356" y="426" font-size="12" fill="#92400e">Homepage, 2026-09-27: 70% off your first box.</text>

    <!-- ============ Panel 3: Maev ============ -->
    <rect x="648" y="70" width="304" height="376" rx="16" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
    <text x="666" y="100" font-size="15" font-weight="700" fill="#0f172a">Maev</text>
    <text x="666" y="120" font-size="12.5" font-weight="700" fill="#1d4ed8">PRICE UNIT: PER 20-LB BAG (and per day)</text>

    <text x="666" y="152" font-size="13" fill="#334155">20 lbs on Subscribe &amp; Save</text>
    <rect x="666" y="160" width="150" height="26" rx="7" fill="#fbbf24"/>
    <text x="824" y="179" font-size="14" font-weight="700" fill="#0f172a">$179</text>

    <text x="666" y="216" font-size="13" fill="#334155">Printed as $6.39 per day, 10% off subscription</text>

    <text x="666" y="256" font-size="13" fill="#334155">20 lbs one-time purchase</text>
    <rect x="666" y="264" width="172" height="26" rx="7" fill="#f59e0b"/>
    <text x="846" y="283" font-size="14" font-weight="700" fill="#0f172a">$206</text>

    <text x="666" y="318" font-size="13" fill="#334155">Printed as $7.36 per day</text>

    <line x1="666" y1="340" x2="934" y2="340" stroke="#cbd5e1" stroke-width="1"/>
    <text x="666" y="364" font-size="12.5" fill="#475569">Bag sizes 10-80 lbs, delivery every 2-10 weeks.</text>
    <text x="666" y="382" font-size="12.5" fill="#475569">Free shipping over $249, all shipments insured.</text>
    <text x="666" y="400" font-size="12.5" fill="#475569">Orders process in 2-5 business days.</text>

    <rect x="666" y="412" width="268" height="34" rx="8" fill="#fef3c7" stroke="#f59e0b"/>
    <text x="676" y="434" font-size="12" fill="#92400e">Banner, 2026-09-27: additional 15% off for new.</text>

    <!-- ============ Bottom warning ============ -->
    <rect x="8" y="462" width="944" height="128" rx="16" fill="#0f172a"/>
    <text x="30" y="494" font-size="16" font-weight="700" fill="#f8fafc">Do not subtract these numbers from each other</text>
    <text x="30" y="520" font-size="13.5" fill="#e2e8f0">We Feed Raw sells by the week, Darwin's sells by the 2.0-lb pack, Maev sells by the 20-lb bag - and no service publishes a conversion between its unit and anyone else's.</text>
    <text x="30" y="544" font-size="13.5" fill="#e2e8f0">Two of the three price you from a plan builder or a selected bag size, so every figure here is a starting price, never your bill.</text>
    <text x="30" y="572" font-size="12.5" fill="#94a3b8">Sources: wefeedraw.com recipe pages and /raw-food-subscription, darwinspet.com product pages, Shop All and /pages/ask-darwins-faqs, meetmaev.com/products/raw-food and /shipping-return - all read 2026-09-27 (UTC+8).</text>

    <text x="8" y="620" font-size="12" fill="#64748b">Pet Fresh Food Decisions - every figure above is quoted from the brand's own official page with its source and check date. Promotions change without notice.</text>
    <text x="8" y="642" font-size="12" fill="#64748b">No third-party price, rating or conversion is used anywhere in this graphic.</text>
  </g>
</svg>
